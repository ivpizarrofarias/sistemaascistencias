# Configuración usada en los TESTS (integración).
# En los tests se usa H2 en memoria para no depender de un servidor MySQL real.
# Los tests verifican toda la lógica de negocio; en producción se usa MySQL
# (configuración del application.properties principal).

spring.datasource.url=jdbc:h2:mem:asistencia_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# JWT para tests (clave larga; se usa tal cual en bytes vía fallback de JwtService)
app.jwt.secret=clave_secreta_tests_sistema_asistencias_jwt_hs256_firmar_tokens
app.jwt.expiration-ms=3600000

# Datos del admin para tests
app.admin.username=admin
app.admin.password=admin123

# Datos de la empresa (para PDF/liquidaciones)
app.company.name=IPFSoft SpA
app.company.rut=76.123.456-7
