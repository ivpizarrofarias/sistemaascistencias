# ============================================
# CONFIGURACIÓN PARA DESARROLLO/PRODUCCIÓN
# ============================================

# Base de datos del servidor (sobrescribible con variables de entorno).
# La contraseña NO se guarda aquí: se inyecta con DB_PASSWORD desde .env / Docker.
spring.datasource.url=${DB_URL:jdbc:mysql://100.73.41.33:3306/sistema_asis?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:dev}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de HikariCP (pool de conexiones)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
# Espera más tiempo si MySQL tarda en levantar al iniciar el contenedor.
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_TIMEOUT:120000}

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Mostrar el SQL generado por Hibernate en consola (false = no lo muestra).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# ============================================
# JWT
# ============================================
# En producción definir JWT_SECRET en .env (mínimo 48 caracteres para HS384).
app.jwt.secret=${JWT_SECRET:clave_secreta_sistema_asistencias_2026_super_segura_para_hs256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================
# Usuario administrador por defecto
# ============================================
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ============================================
# Datos de la empresa (aparecen en el PDF y el encabezado de la liquidación)
# ============================================
app.company.name=${COMPANY_NAME:IPFSoft SpA}
app.company.rut=${COMPANY_RUT:76.123.456-7}

# ============================================
# CORS (solo necesario si la app se sirve desde otro origen)
# ============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ============================================
# Servidor
# ============================================
server.port=${PORT:8080}
