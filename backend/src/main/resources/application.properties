# ============================================
# CONFIGURACIÓN PARA DESARROLLO/PRODUCCIÓN
# ============================================

# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_asis?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=Admin_1983
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de HikariCP (pool de conexiones)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
# Mostrar el SQL generado por Hibernate en consola (false = no lo muestra).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# ⚠️ ELIMINA esta línea si la tienes (el warning lo indica):
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuración de logging (opcional)
# Se deja en WARN para que Hibernate no imprima el SQL ni los parámetros por consola.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ============================================
# JWT (si usas JWT)
# ============================================
# Clave secreta para firmar los tokens. Debe tener al menos 32 caracteres.
app.jwt.secret=clave_secreta_sistema_asistencias_2026_super_segura_para_hs256
app.jwt.expiration-ms=86400000

# ============================================
# Usuario administrador por defecto
# ============================================
app.admin.username=admin
app.admin.password=admin123

# ============================================
# Datos de la empresa (aparecen en el PDF y el encabezado de la liquidación)
# ============================================
app.company.name=IPFSoft SpA
app.company.rut=76.123.456-7

# ============================================
# Servidor
# ============================================
server.port=${PORT:8080}