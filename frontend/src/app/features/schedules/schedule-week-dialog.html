<h2 mat-dialog-title>Horario de {{ data.employee.fullName }}</h2>

<mat-dialog-content>
  <p class="week-range">Semana del {{ range }}</p>

  <mat-form-field appearance="outline" class="label-field">
    <mat-label>Etiqueta (opcional)</mat-label>
    <input
      matInput
      [value]="label()"
      (input)="label.set($any($event.target).value)"
      [placeholder]="'Semana del ' + data.monday"
    />
  </mat-form-field>

  <div class="table-scroll">
    <table mat-table [dataSource]="dayList()" class="data-table day-table">
      <ng-container matColumnDef="dia">
        <th mat-header-cell *matHeaderCellDef>Día</th>
        <td mat-cell *matCellDef="let d">{{ days[d.dayNumber - 1] }}</td>
      </ng-container>

      <ng-container matColumnDef="trabaja">
        <th mat-header-cell *matHeaderCellDef class="center">Trabaja</th>
        <td mat-cell *matCellDef="let d; let i = index" class="center">
          <mat-checkbox
            [checked]="d.worked"
            (change)="toggleWorked(i, $event.checked)"
            [attr.aria-label]="'Trabaja ' + days[d.dayNumber - 1]"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="entrada">
        <th mat-header-cell *matHeaderCellDef>Entrada</th>
        <td mat-cell *matCellDef="let d; let i = index">
          <input
            type="time"
            class="time-input"
            [value]="d.worked ? d.startTime ?? '' : ''"
            [disabled]="!d.worked"
            (input)="onTimeInput(i, 'startTime', $any($event.target).value)"
            [attr.aria-label]="'Entrada ' + days[d.dayNumber - 1]"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="salida">
        <th mat-header-cell *matHeaderCellDef>Salida</th>
        <td mat-cell *matCellDef="let d; let i = index">
          <input
            type="time"
            class="time-input"
            [value]="d.worked ? d.endTime ?? '' : ''"
            [disabled]="!d.worked"
            (input)="onTimeInput(i, 'endTime', $any($event.target).value)"
            [attr.aria-label]="'Salida ' + days[d.dayNumber - 1]"
          />
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="submit()">Guardar horario</button>
</mat-dialog-actions>
