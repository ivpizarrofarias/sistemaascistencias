services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: "${DB_URL:-jdbc:mysql://100.73.41.33:3306/sistema_asis?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Santiago}"
      DB_USERNAME: ${DB_USERNAME:-dev}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_INIT_TIMEOUT: ${DB_INIT_TIMEOUT:-120000}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      COMPANY_NAME: ${COMPANY_NAME:-IPFSoft SpA}
      COMPANY_RUT: ${COMPANY_RUT:-76.123.456-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
